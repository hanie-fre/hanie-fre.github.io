:root { --ink: #111111; --muted: #555555; --soft: #7A7A7A; --red: #D32A1E; --pad: clamp(20px, 5.6vw, 80px); color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; font-family: "Mukta Mahee", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: linear-gradient(180deg, #FFFFFF 0%, #F6F6F4 45%, #ECECE9 100%); overflow-x: clip; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 6px; }
.top { padding: 24px var(--pad) 0; display: flex; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.brand svg { width: 34px; height: auto; }
.copy { position: relative; z-index: 3; text-align: center; padding: clamp(28px, 6vh, 72px) var(--pad) 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.eyebrow { font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); }
h1 { margin: 0; font-weight: 700; font-size: clamp(52px, 8.3vw, 112px); line-height: 0.95; letter-spacing: -0.03em; }
h1 .dot { color: var(--red); }
.copy p { margin: 0; max-width: 34em; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.5; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; transition: transform .2s ease; }
.btn .arrow { color: var(--red); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn:hover { transform: translateY(-2px); }
.scene { position: relative; margin-top: auto; height: clamp(260px, 46vh, 480px); overflow: clip; }
.rays { position: absolute; inset: -40% 0 0; pointer-events: none; }
.rays span { position: absolute; top: 0; width: 120px; height: 140%; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 40%, rgba(255,255,255,0) 100%); transform: skewX(-14deg); animation: ray 9s ease-in-out infinite; }
.rays span:nth-child(1) { left: 18%; } .rays span:nth-child(2) { left: 46%; width: 70px; animation-delay: -3s; } .rays span:nth-child(3) { left: 72%; width: 150px; animation-delay: -6s; }
@keyframes ray { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
.sea { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; display: block; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%); mask-image: linear-gradient(180deg, transparent 0%, #000 22%); }
.weed { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.4s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.anem .tents { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 3.6s ease-in-out infinite; transition: scale .35s cubic-bezier(.3,1.4,.5,1); }
.anem.shy .tents { scale: 1 .28; }
@keyframes wave { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.shell { cursor: pointer; outline: none; }
.shell .lid { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
.shell.open .lid { transform: rotate(-42deg); }
.shell .hint { animation: hint 3.2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.shell.open .hint { animation: none; opacity: 0; }
.shell:focus-visible .hint { animation: none; opacity: 1; stroke: var(--red); }
@keyframes hint { 0%, 55% { opacity: 0; transform: scale(.7); } 70% { opacity: .45; } 100% { opacity: 0; transform: scale(1.15); } }
.pearl-link { position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -100%) scale(.7); opacity: 0; visibility: hidden; transition: opacity .25s ease, transform .35s cubic-bezier(.3,1.5,.5,1), visibility 0s .35s; }
.pearl-link .arrow { color: var(--red); }
.pearl-link.show { opacity: 1; visibility: visible; transform: translate(-50%, -100%) scale(1); transition: opacity .25s ease, transform .35s cubic-bezier(.3,1.5,.5,1); }
.bubbles i { position: absolute; bottom: 12%; width: var(--s); height: var(--s); border-radius: 50%; border: 1.5px solid #9A9A97; opacity: 0; animation: rise var(--t) ease-in var(--d) infinite; pointer-events: none; }
@keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: .8; } 50% { transform: translate(8px, -45vh); } 90% { opacity: .6; } 100% { opacity: 0; transform: translate(-6px, -90vh); } }
.fishlayer { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.lost { position: absolute; left: 0; top: 0; width: 96px; height: auto; will-change: transform; }
.think { position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 20px; line-height: 1; opacity: 0; transition: opacity .25s ease; }
.think::after { content: ""; position: absolute; left: 4px; bottom: -8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
.think.on { opacity: 1; }
.think.yay { color: var(--red); }
.play { margin-top: 4px; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: none; border: 0; border-bottom: 1.5px solid var(--ink); padding: 2px 0; cursor: pointer; }
.play .arrow { color: var(--red); }
body.playing .copy, body.playing .top { opacity: .12; pointer-events: none; transition: opacity .3s ease; }
body.playing .scene { pointer-events: none; }
body.playing .pearl-link { display: none; }
.gfield { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.gcap { position: fixed; inset: 0; z-index: 7; cursor: none; touch-action: none; }
.jelly { position: absolute; left: 0; top: 0; width: 54px; will-change: transform; }
.jelly svg { display: block; width: 100%; height: auto; overflow: visible; }
.jelly .tent { transform-box: fill-box; transform-origin: 50% 0; animation: tent .9s ease-in-out infinite alternate; }
@keyframes tent { from { transform: skewX(-8deg) scaleY(.92); } to { transform: skewX(8deg) scaleY(1.05); } }
.gb { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #72726F; background: radial-gradient(circle at 35% 30%, #fff 0 22%, rgba(255,255,255,.5) 23% 100%); will-change: transform; }
.gb.pop { animation: pop .3s ease-out forwards; }
@keyframes pop { to { opacity: 0; scale: 1.8; } }
.gplus { position: absolute; left: 0; top: 0; font-weight: 700; font-size: 15px; color: var(--red); animation: up .7s ease-out forwards; }
@keyframes up { to { opacity: 0; translate: 0 -30px; } }
.ghud { position: fixed; z-index: 8; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #fff; box-shadow: 0 10px 30px rgba(17,17,17,.14); font-size: 14px; white-space: nowrap; }
.ghud[hidden] { display: none; }
.gstat { padding: 4px 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gstat b { color: var(--ink); font-weight: 700; }
.gstat.best { border-left: 1px solid #E4E4E2; }
.gquit { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 6px 14px; cursor: pointer; }
.gquit kbd { font: inherit; opacity: .6; margin-left: 4px; }
.gover { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px; background: rgba(246,246,244,.55); }
.gover[hidden] { display: none; }
.gcard { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 32px 28px 24px; box-shadow: 0 30px 80px rgba(17,17,17,.2); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.gcard h2 { margin: 0; font-size: 56px; line-height: 1; letter-spacing: -0.03em; }
.gcard h2 .dot { color: var(--red); }
.gcard p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
.gcard .btn { font: inherit; font-size: 15px; font-weight: 600; border: 0; cursor: pointer; }
.gback { font: inherit; font-size: 14px; color: var(--soft); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 640px) { .jelly { width: 42px; } .gb { width: 20px; height: 20px; } .gstat.best { display: none; } .gcard h2 { font-size: 44px; } }
@media (prefers-reduced-motion: reduce) { .play { display: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) {
  .btn { height: 50px; padding: 0 22px; font-size: 15px; }
  .lost { width: 72px; }
  .rays span { width: 60px; }
  .scene { height: 320px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

n-delay:-0.7s"><path d="M0 0 Q-20.5 -6.0 -33.1 -12.0" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="-33.1" cy="-12.0" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q-11.6 -13.1 -31.2 -26.2" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="-31.2" cy="-26.2" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q-15.5 -20.0 -23.1 -40.0" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="-23.1" cy="-40.0" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q0.9 -17.3 -6.1 -34.7" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="-6.1" cy="-34.7" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q-0.5 -20.0 7.1 -40.1" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="7.1" cy="-40.1" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q15.6 -20.0 23.1 -40.0" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="23.1" cy="-40.0" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q9.5 -11.3 27.0 -22.6" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="27.0" cy="-22.6" r="6.5" fill="#D2D2CF"/><path d="M0 0 Q23.1 -7.0 38.2 -13.9" fill="none" stroke="#D2D2CF" stroke-width="9" stroke-linecap="round"/><circle cx="38.2" cy="-13.9" r="6.5" fill="#D2D2CF"/></g><ellipse cx="0" cy="4" rx="26" ry="14" fill="#72726F"/></g></g>

<a class="pearl-link" id="pearl" href="/hobbies.html" tabindex="-1">Found a pearl: my hobbies <span class="arrow" aria-hidden="true">→</span></a>
</div>
<div class="gfield" id="gfield" aria-hidden="true"></div>
<div class="gcap" id="gcap" hidden></div>
<div class="ghud" id="ghud" hidden><span class="gstat"><b id="gbub">0</b> bubbles</span><span class="gstat"><b id="gtime">0.0</b>s</span><span class="gstat best">Best <b id="gbest">0</b></span><button class="gquit" id="gquit" type="button">Quit <kbd>Esc</kbd></button></div>
<div class="gover" id="gover" hidden role="dialog" aria-labelledby="gotitle"><div class="gcard"><span class="eyebrow">Game over</span><h2 id="gotitle">Stung<span class="dot">.</span></h2><p id="gotext"></p><div class="btns"><button class="btn" id="gagain" type="button">Play again</button><a class="btn ghost" href="/">Swim back home</a></div><button class="gback" id="gback" type="button">Back to the page</button></div></div>
<div class="fishlayer" aria-hidden="true"><svg class="lost" id="fish" viewBox="0 0 110 70"><path d="M4 35A44 44 0 0 1 74 35A44 44 0 0 1 4 35Z" fill="#D62A1E"/><path d="M70 35L106 12V58Z" fill="#D62A1E"/><circle cx="22" cy="31" r="3.4" fill="#ffffff"/></svg><div class="think" id="think">?</div></div>
<p class="sr" aria-live="polite" id="live"></p>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fish = document.getElementById('fish'), think = document.getElementById('think');
  var scene = document.getElementById('scene'), home = document.getElementById('home');
  var shell = document.getElementById('shell'), pearl = document.getElementById('pearl'), live = document.getElementById('live');
  var anems = [].slice.call(document.querySelectorAll('.anem'));
  var W = function () { return window.innerWidth; }, Hh = function () { return window.innerHeight; };
  var FW = function () { return fish.getBoundingClientRect().width || 96; };
  var S = { x: W() * 0.3, y: Hh() * 0.62, dir: -1, tx: 0, ty: 0, mode: 'wander', next: 0, pauseUntil: 0, look: 0, px: null, py: null, lastMove: -1e9, spin: 0, spinAt: 0, rot: 0, bob: 0, hold: 0 };

  var zone = function () {
    var sr = scene.getBoundingClientRect(), cr = document.querySelector('.btns').getBoundingClientRect();
    var top = Math.max(cr.bottom + 40, 80), bot = Math.max(top + 40, sr.top + sr.height * 0.55);
    return [70, W() - 70, top, Math.min(bot, Hh() - 60)];
  };
  var pick = function (now) { var z = zone(); S.tx = z[0] + Math.random() * (z[1] - z[0]); S.ty = z[2] + Math.random() * (z[3] - z[2]); S.next = now + 3200 + Math.random() * 2400; };
  var setThink = function (t, yay) { think.textContent = t; think.classList.toggle('on', !!t); think.classList.toggle('yay', !!yay); };
  var draw = function () {
    var w = FW(), h = w * 70 / 110;
    fish.style.transform = 'translate(' + (S.x - w / 2).toFixed(1) + 'px,' + (S.y - h / 2 + S.bob).toFixed(1) + 'px) rotate(' + S.rot.toFixed(1) + 'deg) scaleX(' + S.dir + ')';
    think.style.transform = 'translate(' + (S.x - (S.dir === 1 ? w * 0.42 : -w * 0.05)).toFixed(1) + 'px,' + (S.y - h / 2 - 44 + S.bob).toFixed(1) + 'px)';
  };

  /* shy anemones and the pointer */
  var shyCheck = function (cx, cy) {
    anems.forEach(function (a) {
      var r = a.getBoundingClientRect(), ax = r.left + r.width / 2, ay = r.top + r.height / 2;
      var d = Math.hypot(cx - ax, cy - ay);
      a.classList.toggle('shy', d < Math.max(110, r.width * 1.1));
    });
  };
  document.addEventListener('pointermove', function (e) { S.px = e.clientX; S.py = e.clientY; S.lastMove = performance.now(); shyCheck(e.clientX, e.clientY); });
  document.addEventListener('pointerdown', function (e) { S.px = e.clientX; S.py = e.clientY; S.lastMove = performance.now(); shyCheck(e.clientX, e.clientY); });
  document.addEventListener('pointerleave', function () { S.px = null; anems.forEach(function (a) { a.classList.remove('shy'); }); });

  /* the way home */
  var homeOn = false;
  home.addEventListener('mouseenter', function () { homeOn = true; });
  home.addEventListener('mouseleave', function () { homeOn = false; });
  home.addEventListener('focus', function () { homeOn = true; });
  home.addEventListener('blur', function () { homeOn = false; });

  /* the shell keeps a secret */
  var placePearl = function () {
    var r = shell.getBoundingClientRect(), s = scene.getBoundingClientRect();
    pearl.style.left = (r.left + r.width / 2 - s.left) + 'px';
    pearl.style.top = (r.top - s.top - 6) + 'px';
  };
  var toggleShell = function () {
    var open = !shell.classList.contains('open');
    shell.classList.toggle('open', open);
    shell.setAttribute('aria-expanded', open ? 'true' : 'false');
    placePearl();
    pearl.classList.toggle('show', open);
    pearl.tabIndex = open ? 0 : -1;
    live.textContent = open ? 'The shell opened. Inside: a link to my hobbies.' : '';
    if (open) { S.hold = performance.now() + 2600; var r = shell.getBoundingClientRect(); S.tx = r.left - 150; S.ty = r.top + 34; setThink('!', true); }
  };
  shell.addEventListener('click', toggleShell);
  shell.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleShell(); } });
  window.addEventListener('resize', function () { if (shell.classList.contains('open')) placePearl(); });

  if (reduce) {
    var z0 = zone(); S.x = W() * 0.5; S.y = (z0[2] + z0[3]) / 2; S.dir = -1; setThink('?'); draw();
    window.addEventListener('resize', function () { var z = zone(); S.x = W() * 0.5; S.y = (z[2] + z[3]) / 2; draw(); });
    return;
  }

  /* ---------- mini game: dodge the jellyfish ---------- */
  var G = { on: false, over: false, t: 0, bub: 0, items: [], nextJ: 0, nextB: 0, best: 0 };
  var gfield = document.getElementById('gfield'), gcap = document.getElementById('gcap'), ghud = document.getElementById('ghud');
  var gover = document.getElementById('gover'), gotext = document.getElementById('gotext'), playBtn = document.getElementById('play');
  var gbub = document.getElementById('gbub'), gtime = document.getElementById('gtime'), gbest = document.getElementById('gbest');
  try { G.best = parseInt(localStorage.getItem('lostAtSeaBest') || '0', 10) || 0; } catch (e) {}
  gbest.textContent = G.best;
  var JELLY = function (dark) {
    var bell = dark ? '#3A3A38' : '#D2D2CF', line = dark ? '#72726F' : '#A8A8A5', eye = dark ? '#fff' : '#3A3A38';
    return '<svg viewBox="0 0 60 84"><g class="tent" fill="none" stroke="' + line + '" stroke-width="3" stroke-linecap="round"><path d="M16 34 q-5 10 0 20 q5 10 0 22"/><path d="M26 34 q5 12 0 24 q-5 10 0 20"/><path d="M36 34 q-5 12 0 24 q5 10 0 20"/><path d="M46 34 q5 10 0 20 q-5 10 0 22"/></g>' +
      '<path d="M6 32 A24 24 0 0 1 54 32 Q51 37 46 34 Q41 38 36 34 Q31 38 26 34 Q21 38 16 34 Q11 37 6 32 Z" fill="' + bell + '" stroke="' + (dark ? bell : '#8F8F8C') + '" stroke-width="2"/>' +
      '<circle cx="23" cy="22" r="2.6" fill="' + eye + '"/><circle cx="37" cy="22" r="2.6" fill="' + eye + '"/></svg>';
  };
  var field = function () { return [40, W() - 40, 70, Hh() - Math.min(140, Hh() * 0.16)]; };
  var spawn = function (kind) {
    var f = field(), el;
    if (kind === 'j') { el = document.createElement('div'); el.className = 'jelly'; el.innerHTML = JELLY(Math.random() < 0.55); }
    else { el = document.createElement('i'); el.className = 'gb'; }
    gfield.appendChild(el);
    var it = { kind: kind, el: el, x: W() + 50, y: f[2] + Math.random() * (f[3] - f[2]), ph: Math.random() * 6.28, amp: kind === 'j' ? 18 + Math.random() * 26 : 10, w: el.getBoundingClientRect().width || 40 };
    G.items.push(it); return it;
  };
  var clearItems = function () { G.items.forEach(function (it) { it.el.remove(); }); G.items = []; gfield.innerHTML = ''; };
  var startGame = function () {
    clearItems(); G.on = true; G.over = false; G.t = 0; G.bub = 0; G.nextJ = 600; G.nextB = 300;
    gbub.textContent = '0'; gtime.textContent = '0.0';
    document.body.classList.add('playing'); gcap.hidden = false; ghud.hidden = false; gover.hidden = true;
    setThink(''); S.rot = 0; S.spin = 0;
    if (S.px === null) { S.px = W() * 0.3; S.py = Hh() * 0.5; }
    live.textContent = 'Game started. Move your pointer or finger to steer the fish. Collect bubbles, avoid jellyfish.';
  };
  var endGame = function (stung) {
    G.on = false; gcap.hidden = true;
    if (!stung) { quitGame(); return; }
    G.over = true;
    var secs = G.t.toFixed(1), newBest = G.bub > G.best;
    if (newBest) { G.best = G.bub; gbest.textContent = G.best; try { localStorage.setItem('lostAtSeaBest', String(G.best)); } catch (e) {} }
    gotext.textContent = 'You collected ' + G.bub + (G.bub === 1 ? ' bubble' : ' bubbles') + ' and lasted ' + secs + ' seconds.' + (newBest ? ' A new best!' : ' Best so far: ' + G.best + '.');
    gover.hidden = false; setThink('!', true);
    document.getElementById('gagain').focus();
    live.textContent = 'Stung. ' + gotext.textContent;
  };
  var quitGame = function () {
    G.on = false; G.over = false; clearItems(); gcap.hidden = true; ghud.hidden = true; gover.hidden = true;
    document.body.classList.remove('playing'); playBtn.focus();
  };
  playBtn.addEventListener('click', startGame);
  document.getElementById('gquit').addEventListener('click', quitGame);
  document.getElementById('gagain').addEventListener('click', startGame);
  document.getElementById('gback').addEventListener('click', quitGame);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (G.on || G.over)) quitGame(); });
  gcap.addEventListener('pointermove', function (e) { S.px = e.clientX; S.py = e.clientY; S.lastMove = performance.now(); });
  gcap.addEventListener('pointerdown', function (e) { S.px = e.clientX; S.py = e.clientY; S.lastMove = performance.now(); });
  var gameStep = function (now, dt) {
    var sec = dt / 1000; G.t += sec;
    var speed = Math.min(560, 170 + G.t * 9);
    G.nextJ -= dt; G.nextB -= dt;
    if (G.nextJ <= 0) { spawn('j'); G.nextJ = Math.max(420, 1150 - G.t * 28) * (0.75 + Math.random() * 0.5); }
    if (G.nextB <= 0) { spawn('b'); G.nextB = 700 + Math.random() * 600; }
    var fr = FW() * 0.3, fx = S.x + (S.dir === 1 ? -FW() * 0.12 : FW() * 0.12);
    for (var i = G.items.length - 1; i >= 0; i--) {
      var it = G.items[i];
      it.x -= speed * sec * (it.kind === 'b' ? 0.85 : 1);
      it.ph += sec * (it.kind === 'j' ? 2.4 : 3.5);
      var y = it.y + Math.sin(it.ph) * it.amp;
      it.el.style.transform = 'translate(' + (it.x - it.w / 2).toFixed(1) + 'px,' + (y - it.w / 2).toFixed(1) + 'px)';
      if (it.x < -80) { it.el.remove(); G.items.splice(i, 1); continue; }
      var cy = it.kind === 'j' ? y - it.w * 0.12 : y, r = it.kind === 'j' ? it.w * 0.36 : it.w * 0.5;
      if (Math.hypot(it.x - fx, cy - S.y) < r + fr) {
        if (it.kind === 'b') {
          G.bub++; gbub.textContent = G.bub;
          it.el.classList.add('pop'); var el = it.el; setTimeout(function () { el.remove(); }, 320);
          var plus = document.createElement('span'); plus.className = 'gplus'; plus.textContent = '+1';
          plus.style.transform = 'translate(' + it.x + 'px,' + (y - 30) + 'px)'; gfield.appendChild(plus); setTimeout(function () { plus.remove(); }, 720);
          G.items.splice(i, 1);
        } else { endGame(true); return; }
      }
    }
    gtime.textContent = G.t.toFixed(1);
  };

  var last = performance.now();
  pick(last);
  var loop = function (now) {
    var dt = Math.min(48, now - last); last = now;
    var z = zone(), speed = 70, following = S.px !== null && now - S.lastMove < 2600;
    S.bob = Math.sin(now / 520) * 5;
    if (G.on || G.over) {
      if (G.on) {
        var f = field();
        S.tx = Math.max(f[0], Math.min(f[1], S.px)); S.ty = Math.max(f[2], Math.min(f[3], S.py)); speed = 900;
        S.bob = 0;
      } else speed = 0;
    } else if (homeOn) {
      var hr = home.getBoundingClientRect();
      S.tx = hr.left + hr.width / 2; S.ty = hr.bottom + 84; speed = 340;
      if (Math.hypot(S.tx - S.x, S.ty - S.y) < 30 && now - S.spinAt > 1500) { S.spinAt = now; S.spin = 1; }
      setThink('!', true);
    } else if (now < S.hold) {
      speed = 220;
    } else if (following) {
      S.tx = S.px; S.ty = Math.max(z[2], Math.min(Hh() - 60, S.py)); speed = 200;
      setThink('');
    } else {
      if (now > S.next) pick(now);
      if (now < S.pauseUntil) {
        speed = 0;
        if (now > S.look) { S.dir = -S.dir; S.look = now + 700; }
        setThink('?');
      } else {
        setThink('');
        if (Math.hypot(S.tx - S.x, S.ty - S.y) < 12) { S.pauseUntil = now + 2300; S.look = now + 600; pick(now + 2300); }
      }
    }
    var dx = S.tx - S.x, dy = S.ty - S.y, d = Math.hypot(dx, dy), keep = following && !homeOn && !G.on ? 60 : 0;
    if (speed && d > keep + 1) {
      var mv = Math.min(d - keep, speed * dt / 1000);
      S.x += dx / d * mv; S.y += dy / d * mv;
      if (Math.abs(dx) > 4) S.dir = dx > 0 ? -1 : 1;
    }
    if (S.spin) { var p = (now - S.spinAt) / 700; if (p >= 1) { S.spin = 0; S.rot = 0; } else S.rot = -360 * (1 - Math.pow(1 - p, 3)); }
    if (G.on) gameStep(now, dt);
    draw();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
